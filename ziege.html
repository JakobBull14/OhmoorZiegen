<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Schulziegen – Ziege</title>
<link rel="icon" type="image/svg+xml" href="/OhmoorZiegen/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/OhmoorZiegen/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/OhmoorZiegen/favicon-16.png">
<link rel="apple-touch-icon" href="/OhmoorZiegen/apple-touch-icon.png">
<link rel="manifest" href="/OhmoorZiegen/manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="stylesheet" href="/OhmoorZiegen/style.css">
</head>
<body>

<div id="nav-root"></div>

<main class="app-main">
  <a class="detail-back" href="/OhmoorZiegen/index.html">← Zurück zur Übersicht</a>
  <div id="page-body"></div>
</main>

<script src="/OhmoorZiegen/data.js"></script>
<script src="/OhmoorZiegen/nav.js"></script>
<script>
buildNav('gallery');

// ID aus URL lesen
const params = new URLSearchParams(location.search);
const goatId = parseInt(params.get('id'));
let goats = [];
let goat = null;
let goatIdx = -1;

initPage();

async function initPage() {
  try {
    goats = await getGoatsFromApi();
  } catch (e) {
    console.error('API-Laden fehlgeschlagen, nutze lokalen Fallback.', e);
    goats = getGoats();
  }

  goat = goats.find(g => g.id === goatId);
  goatIdx = goats.findIndex(g => g.id === goatId);

  if (!goat) {
    document.getElementById('page-body').innerHTML = `
      <div class="empty-state">
        <span class="empty-state-icon">🤷</span>
        <div class="empty-state-text">Ziege nicht gefunden</div>
        <a href="/OhmoorZiegen/index.html" class="btn-primary" style="margin-top:16px;display:inline-flex">Zur Galerie</a>
      </div>`;
    return;
  }

  document.title = `Schulziegen – ${goat.name}`;
  renderPage();
}

function renderPage() {
  const votedId = getVotedId();
  const voted   = votedId === goat.id;
  const hasVoted= votedId !== null;
  const isAdmin = isAdminLoggedIn();

  const prevGoat = goatIdx > 0 ? goats[goatIdx - 1] : null;
  const nextGoat = goatIdx < goats.length - 1 ? goats[goatIdx + 1] : null;

  // Hauptbild immer oben, Galerie zusätzlich darunter
  const isMemorial = !!goat.deceased_date;
  const memorialRibbon = isMemorial
    ? `<div class="goat-memorial-ribbon detail">${escHtml(memorialLabel(goat))}</div>` : '';

  const hauptbildHtml = goat.foto
    ? `<div class="detail-photo${isMemorial ? ' goat-memorial' : ''}" style="aspect-ratio:16/9;overflow:hidden">
         <img src="${goat.foto}" alt="${goat.name}"
              style="width:100%;height:100%;object-fit:contain;background:#f5f5f5"
              onerror="this.parentNode.innerHTML='<span style=\'font-size:7rem\'>${goat.e}</span>'">
         ${memorialRibbon}
       </div>`
    : `<div class="detail-photo"><span>${goat.e}</span></div>`;

  const photoHtml = hauptbildHtml;

  document.getElementById('page-body').innerHTML = `
    <div class="detail-card">

      ${photoHtml}



      <div class="detail-body">
        <div class="detail-name">${escHtml(goat.name)}</div>
        <div class="detail-nick">${escHtml(goat.nick || '')}</div>

        <div class="detail-grid">
          <div>
            <div class="detail-field-label">Rasse</div>
            <div class="detail-field-value" id="f-breed">${escHtml(goat.breed || '')}</div>
          </div>
          <div>
            <div class="detail-field-label">Alter</div>
            <div class="detail-field-value" id="f-age">${escHtml(displayAge(goat.age))}</div>
          </div>
          <div>
            <div class="detail-field-label">Charakter</div>
            <div class="detail-field-value" id="f-character">${escHtml(goat.character || '')}</div>
          </div>
          <div>
            <div class="detail-field-label">Lieblingsessen</div>
            <div class="detail-field-value" id="f-food">${escHtml(goat.food || '')}</div>
          </div>
          ${goat.mother ? `<div>
            <div class="detail-field-label">Elternteil</div>
            <div class="detail-field-value">${escHtml(goat.mother)}</div>
          </div>` : ''}
          <div>
            <div class="detail-field-label">Besondere Fähigkeit</div>
            <div class="detail-field-value" id="f-skill">${escHtml(goat.skill || '')}</div>
          </div>
        </div>

        <div class="detail-story">
          <div class="detail-field-label">Geschichte</div>
          <div class="detail-field-value" id="f-story">${escHtml(goat.story || '')}</div>
        </div>

        <div id="goat-photos-section"></div>

      </div>

      <div class="detail-nav">
        <button class="vote-btn${voted ? ' voted' : ''}" id="vote-btn"
          onclick="doVote()">
          ${voted ? '♥ Du hast gewählt' : hasVoted ? '♡ Stimme ändern' : '♡ Abstimmen'}
        </button>
        <span style="font-size:13px;color:var(--clr-text-muted)">${goat.votes > 0 ? `♡ ${goat.votes} Stimme${goat.votes !== 1 ? 'n' : ''}` : ''}</span>

        <div style="display:flex;gap:8px;margin-left:auto">
          ${prevGoat ? `<a class="modal-arrow" href="/OhmoorZiegen/ziege.html?id=${prevGoat.id}" title="${prevGoat.name}">‹</a>` : ''}
          ${nextGoat ? `<a class="modal-arrow" href="/OhmoorZiegen/ziege.html?id=${nextGoat.id}" title="${nextGoat.name}">›</a>` : ''}
        </div>
      </div>
    </div>`;

  loadGoatPhotosSection();
}

// ── Fotos von dieser Ziege (aus der zentralen Galerie) ──
async function loadGoatPhotosSection() {
  const box = document.getElementById('goat-photos-section');
  if (!box) return;
  try {
    const photos = await fetchGalleryPhotos({ goat_id: goat.id });
    if (!photos.length) { box.innerHTML = ''; return; }
    const preview = photos.slice(0, 6);
    box.innerHTML = `
      <div class="detail-field-label">📷 Fotos von ${escHtml(goat.name)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px">
        ${preview.map(p => `
          <a href="/OhmoorZiegen/galerie.html?goat=${goat.id}" style="display:block;aspect-ratio:1;border-radius:10px;overflow:hidden">
            <img src="${escHtml(p.image_url)}" alt="${escHtml(p.caption || goat.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover">
          </a>`).join('')}
      </div>
      ${photos.length > preview.length
        ? `<a href="/OhmoorZiegen/galerie.html?goat=${goat.id}" style="display:inline-block;margin-top:10px;font-size:13px;color:var(--clr-blue);font-weight:600">Alle ${photos.length} Fotos ansehen →</a>`
        : ''}
    `;
  } catch (e) { console.warn('Fotos konnten nicht geladen werden.', e); }
}

// ── Geburtsjahr → Alter ──
function displayAge(val) {
  if (!val) return '';
  const s = String(val).trim();
  const n = parseInt(s);
  if (!isNaN(n) && n >= 1990 && n <= new Date().getFullYear()) {
    const age = new Date().getFullYear() - n;
    return age === 1 ? '1 Jahr' : `${age} Jahre`;
  }
  return s; // altes Format, unverändert anzeigen
}

// ── Abstimmen ──
async function doVote() {
  try {
    await submitVote(goat.id);
    await fetchCurrentVote();
    const allGoats = await getGoatsFromApi();
    goats = allGoats;
    goat = goats.find(g => g.id === goatId);
    goatIdx = goats.findIndex(g => g.id === goatId);
    renderPage();
  } catch (err) {
    alert(err.message || 'Abstimmen fehlgeschlagen.');
  }
}
</script>
</body>
</html>
