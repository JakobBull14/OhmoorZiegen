<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Schulziegen – Ziege des Monats</title>
<link rel="icon" type="image/svg+xml" href="/OhmoorZiegen/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/OhmoorZiegen/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/OhmoorZiegen/favicon-16.png">
<link rel="apple-touch-icon" href="/OhmoorZiegen/apple-touch-icon.png">
<link rel="manifest" href="/OhmoorZiegen/manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="stylesheet" href="/OhmoorZiegen/style.css">
</head>
<body>

<div id="nav-root"></div>

<main class="app-main">
  <div class="page-title">⭐ Ziege des Monats</div>

  <div id="month-winner-section"></div>

  <div id="month-current-section">
    <p style="font-size:14px;color:var(--clr-text-muted)">Lade Abstimmung ...</p>
  </div>

  <div id="month-history-section"></div>
</main>

<script src="/OhmoorZiegen/data.js"></script>
<script src="/OhmoorZiegen/nav.js"></script>
<script>
buildNav('monat');

let goats = [];
let voteResults = { total_votes: 0, results: [], month_label: '' };

function goatPhotoHtml(g, size) {
  return g.foto || g.main_image_url
    ? `<img src="${escHtml(g.foto || g.main_image_url)}" alt="${escHtml(g.name)}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%" onerror="this.style.display='none'">`
    : `<span style="font-size:${Math.round(size * 0.6)}px">${escHtml(g.e || '🐐')}</span>`;
}

// ── Amtierender Gewinner des abgeschlossenen Vormonats ──
async function loadMonthWinner() {
  const box = document.getElementById('month-winner-section');
  try {
    const month = await fetchMonthWinner();
    if (!month.goats.length) { box.innerHTML = ''; return; }

    const names = monthWinnerNamesHtml(month);
    box.innerHTML = `
      <div class="gotm-card">
        <div style="display:flex;gap:10px">
          ${month.goats.slice(0, 3).map(g => `<div class="gotm-photo" style="width:64px;height:64px">${goatPhotoHtml(g, 64)}</div>`).join('')}
        </div>
        <div>
          <div class="gotm-label">${month.tie ? 'Ziegen des Monats (geteilter Sieg)' : 'Ziege des Monats'} · ${escHtml(month.month_label)}</div>
          <div class="gotm-name">${names}</div>
          <div class="gotm-votes">♥ ${month.votes} Stimme${month.votes !== 1 ? 'n' : ''}</div>
        </div>
      </div>`;
  } catch (e) { console.warn('Monatssieger konnte nicht geladen werden.', e); box.innerHTML = ''; }
}

// ── Laufende, noch nicht abgeschlossene Abstimmung ──
function renderCurrentVote() {
  const box = document.getElementById('month-current-section');
  if (!goats.length) { box.innerHTML = '<p style="font-size:14px;color:var(--clr-text-muted)">Lade Abstimmung ...</p>'; return; }

  const voteMap = {};
  (voteResults.results || []).forEach(r => { voteMap[r.id] = Number(r.votes || 0); });

  const enriched = goats.map(g => ({ ...g, votes: voteMap[g.id] || 0 }));
  const sorted = [...enriched].sort((a, b) => b.votes - a.votes || a.name.localeCompare(b.name, 'de'));
  const total = voteResults.total_votes || 0;
  const votedId = getVotedId();
  const leader = total > 0 ? sorted[0] : null;

  box.innerHTML = `
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--clr-blue);margin:24px 0 8px">
      🗳️ Aktuelle Abstimmung · ${escHtml(voteResults.month_label || '')} läuft noch
    </div>

    ${leader
      ? `<p style="font-size:13px;color:var(--clr-text-muted);margin-bottom:12px">Aktuell führt <strong style="color:var(--clr-text)">${escHtml(leader.name)}</strong> – das Ergebnis steht erst am Monatsende fest.</p>`
      : `<p style="font-size:13px;color:var(--clr-text-muted);margin-bottom:12px">Noch keine Stimmen – stimme jetzt für deine Lieblingsziege ab!</p>`}

    <p style="font-size:13px;color:var(--clr-text-muted);margin:0 0 16px">
      ${votedId === null
        ? 'Du kannst abstimmen und deine Wahl später auf diesem Gerät wieder ändern.'
        : 'Du hast bereits abgestimmt und kannst deine Stimme jederzeit auf diesem Gerät ändern.'}
    </p>

    <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--clr-text-faint);margin-bottom:12px">
      Abstimmungsergebnis · insgesamt ${total} Stimmen
    </div>

    <div id="vote-list">
      ${sorted.map(g => {
        const ph = g.foto
          ? `<img src="${g.foto}" style="width:28px;height:28px;object-fit:cover;border-radius:50%;flex-shrink:0" onerror="this.style.display='none'">`
          : `<span style="font-size:18px">${escHtml(g.e)}</span>`;
        const pct = total > 0 ? Math.round(g.votes / total * 100) : 0;
        const rankStyle = sorted.length >= 3
          ? (g.id === sorted[0].id
              ? 'background:linear-gradient(90deg, rgba(212,175,55,0.22), rgba(212,175,55,0.06));border:1px solid rgba(212,175,55,0.45);box-shadow:0 6px 16px rgba(212,175,55,0.16);'
              : g.id === sorted[1].id
                ? 'background:linear-gradient(90deg, rgba(192,192,192,0.22), rgba(192,192,192,0.06));border:1px solid rgba(160,160,160,0.4);box-shadow:0 6px 16px rgba(160,160,160,0.14);'
                : g.id === sorted[2].id
                  ? 'background:linear-gradient(90deg, rgba(205,127,50,0.22), rgba(205,127,50,0.06));border:1px solid rgba(205,127,50,0.42);box-shadow:0 6px 16px rgba(205,127,50,0.14);'
                  : '')
          : '';
        const fillStyle = sorted.length >= 3
          ? (g.id === sorted[0].id
              ? 'background:linear-gradient(90deg, #d4af37, #f3d46b);'
              : g.id === sorted[1].id
                ? 'background:linear-gradient(90deg, #aeb4bc, #d9dde2);'
                : g.id === sorted[2].id
                  ? 'background:linear-gradient(90deg, #c27a42, #e0a06f);'
                  : '')
          : '';

        return `<div class="vote-row" style="${rankStyle}">
          ${ph}
          <a href="/OhmoorZiegen/ziege.html?id=${g.id}" class="vote-row-name" style="color:var(--clr-text);text-decoration:none">${escHtml(g.name)}</a>
          <div class="vote-row-bar"><div class="vote-row-fill" style="width:${pct}%;${fillStyle}"></div></div>
          <span class="vote-row-count">♥ ${g.votes}</span>
          ${Number(votedId) === Number(g.id)
            ? `<button class="vote-btn" style="padding:5px 12px;font-size:12px" onclick="doVote(${g.id})">Deine Wahl</button>`
            : `<button class="vote-btn" style="padding:5px 12px;font-size:12px" onclick="doVote(${g.id})">${votedId === null ? 'Abstimmen' : 'Umvoten'}</button>`
          }
        </div>`;
      }).join('')}
    </div>`;
}

// ── Bisherige Ziegen des Monats ──
async function loadMonthHistory() {
  const box = document.getElementById('month-history-section');
  try {
    const history = await fetchMonthHistory();
    if (!history.length) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--clr-text-faint);margin:28px 0 10px">📜 Bisherige Ziegen des Monats</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${history.map(m => `
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--clr-border-soft);border-radius:12px;background:var(--clr-bg)">
            <div style="display:flex;gap:-6px">${m.goats.slice(0, 3).map(g => goatPhotoHtml(g, 32)).join('')}</div>
            <div style="flex:1;font-size:13px">
              <strong>${monthWinnerNamesHtml(m)}</strong>
              <span style="color:var(--clr-text-muted)"> · ${escHtml(m.month_label)}${m.tie ? ' (geteilter Sieg)' : ''}</span>
            </div>
            <span style="font-size:12px;color:var(--clr-text-muted)">♥ ${m.votes}</span>
          </div>`).join('')}
      </div>`;
  } catch (e) { console.warn('Monatshistorie konnte nicht geladen werden.', e); box.innerHTML = ''; }
}

async function doVote(id) {
  try {
    await submitVote(id);
    await fetchCurrentVote();
    voteResults = await fetchVoteResults();
    renderCurrentVote();
  } catch (err) {
    alert(err.message || 'Abstimmung fehlgeschlagen.');
  }
}

async function initPage() {
  try {
    goats = await getGoatsFromApi();
  } catch (err) {
    goats = getGoats();
  }

  try { await fetchCurrentVote(); } catch (err) {}

  try {
    voteResults = await fetchVoteResults();
  } catch (err) {
    voteResults = { total_votes: 0, results: [], month_label: '' };
  }

  renderCurrentVote();
  await loadMonthWinner();
  await loadMonthHistory();
}

initPage();
</script>
</body>
</html>
